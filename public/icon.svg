<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Calendar grid lines -->
  <g opacity="0.15" stroke="white" stroke-width="2">
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="270" x2="432" y2="270"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="180" y1="140" x2="180" y2="410"/>
    <line x1="256" y1="140" x2="256" y2="410"/>
    <line x1="332" y1="140" x2="332" y2="410"/>
  </g>
  <!-- Cross/Plus symbol (nurse) -->
  <rect x="216" y="60" width="80" height="56" rx="8" fill="#f9a8d4" opacity="0.9"/>
  <rect x="232" y="48" width="48" height="80" rx="8" fill="#f9a8d4" opacity="0.9"/>
  <!-- Shift badges -->
  <circle cx="140" cy="235" r="22" fill="#fef3c7"/>
  <text x="140" y="242" text-anchor="middle" font-size="22" font-weight="bold" fill="#d97706" font-family="sans-serif">日</text>
  <circle cx="296" cy="235" r="22" fill="#ede9fe"/>
  <text x="296" y="242" text-anchor="middle" font-size="22" font-weight="bold" fill="#7c3aed" font-family="sans-serif">深</text>
  <circle cx="218" cy="305" r="22" fill="#f3f4f6"/>
  <text x="218" y="312" text-anchor="middle" font-size="22" font-weight="bold" fill="#9ca3af" font-family="sans-serif">休</text>
  <circle cx="374" cy="305" r="22" fill="#d1fae5"/>
  <text x="374" y="312" text-anchor="middle" font-size="22" font-weight="bold" fill="#059669" font-family="sans-serif">有</text>
  <circle cx="140" cy="375" r="22" fill="#ffedd5"/>
  <text x="140" y="382" text-anchor="middle" font-size="22" font-weight="bold" fill="#ea580c" font-family="sans-serif">準</text>
  <!-- Common off day highlight -->
  <circle cx="374" cy="375" r="26" fill="none" stroke="#f472b6" stroke-width="3" opacity="0.8"/>
  <circle cx="374" cy="375" r="22" fill="#fce7f3"/>
  <text x="374" y="382" text-anchor="middle" font-size="22" font-weight="bold" fill="#ec4899" font-family="sans-serif">♡</text>
  <!-- App name -->
  <text x="256" y="460" text-anchor="middle" font-size="36" font-weight="bold" fill="white" opacity="0.9" font-family="sans-serif" letter-spacing="6">NS</text>
</svg>
